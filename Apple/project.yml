name: Galleonaire
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  GalleonaireCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: HT5X86Q4DD
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Galleonaire:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [GalleonMaster.png, WatchAssets.xcassets]
    dependencies:
      - package: GalleonaireCore
      - target: GalleonaireWatch
        embed: true
        link: false
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidneytambin.galleonaire
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: Galleonaire
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  GalleonaireWatch:
    type: application
    platform: watchOS
    sources:
      - path: App
        excludes: [GalleonMaster.png, Assets.xcassets]
    dependencies:
      - package: GalleonaireCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidneytambin.galleonaire.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: Galleonaire
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.sidneytambin.galleonaire
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
  GalleonaireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: Galleonaire
      - package: GalleonaireCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidneytambin.galleonaire.uitests
  GalleonaireWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: WatchUITests
    dependencies:
      - target: GalleonaireWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidneytambin.galleonaire.watchkitapp.uitests
schemes:
  Galleonaire:
    build:
      targets:
        Galleonaire: all
    test:
      targets: [GalleonaireUITests]
  GalleonaireWatch:
    build:
      targets:
        GalleonaireWatch: all
    test:
      targets: [GalleonaireWatchUITests]
