name: Duo Layout Diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/duo-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect supported simulator and accessibility controls
        timeout-minutes: 12
        run: python3 Scripts/duo_diagnostics.py --controls-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-layout-diagnostics
          path: Artifacts/
          retention-days: 3
