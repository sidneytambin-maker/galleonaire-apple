name: Duo Layout Diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/duo-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install published simulator display tools
        run: |
          brew install xcodegen facebook/fb/idb-companion
          python3 -m venv "$RUNNER_TEMP/galleonaire-duo-tools"
          "$RUNNER_TEMP/galleonaire-duo-tools/bin/pip" install fb-idb==1.7.7
          echo "$RUNNER_TEMP/galleonaire-duo-tools/bin" >> "$GITHUB_PATH"
      - name: Verify Duo transitions with bounded accessibility-service startup retries
        timeout-minutes: 35
        run: python3 Scripts/duo_diagnostics.py --app-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-layout-diagnostics
          path: Artifacts/
          retention-days: 3
