name: Apple Build and Tests
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Native validation stage
        type: choice
        options: [all, unit, phone, watch, archive]
        default: all
      watch_settings_only:
        description: Run only the Watch Settings diagnostic (not release validation)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: galleonaire-native-validation
  cancel-in-progress: false
jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Validate migrated questions
        run: python3 Scripts/question_pack.py
      - name: Check app identity and package validation
        run: python3 -m unittest discover -s Scripts -p 'test_*.py' -v
      - name: Install project generator
        run: brew install xcodegen
      - name: Run native validation
        run: python3 Scripts/ci.py --stage '${{ inputs.stage }}' ${{ inputs.watch_settings_only && '--watch-settings-only' || '' }}
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galleonaire-native-evidence-${{ github.run_number }}
          path: Artifacts/
          retention-days: 3
