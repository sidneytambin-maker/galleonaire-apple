name: TestFlight Release
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to Apple after validation (requires an App Store Connect app record)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: galleonaire-testflight-release
  cancel-in-progress: false
jobs:
  validation:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        stage: [unit, phone, watch, archive]
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/question_pack.py
      - run: python3 -m unittest discover -s Scripts -p 'test_*.py' -v
      - run: brew install xcodegen
      - run: python3 Scripts/ci.py --stage "${{ matrix.stage }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galleonaire-release-tests-${{ matrix.stage }}-${{ github.run_number }}
          path: Artifacts/
          retention-days: 3
  release:
    needs: validation
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 35
    environment: testflight
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Prepare release tools
        run: |
          python3 -m venv "$RUNNER_TEMP/galleonaire-release-tools"
          "$RUNNER_TEMP/galleonaire-release-tools/bin/pip" install PyYAML==6.0.2
      - name: Sign, inspect and upload
        env:
          APPLE_PHONE_PROFILE_BASE64: ${{ secrets.APPLE_PHONE_PROFILE_BASE64 }}
          APPLE_WATCH_PROFILE_BASE64: ${{ secrets.APPLE_WATCH_PROFILE_BASE64 }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_PASSWORD }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: '"$RUNNER_TEMP/galleonaire-release-tools/bin/python" Scripts/release.py --build "${{ github.run_number }}" ${{ inputs.upload && ''--upload'' || '''' }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galleonaire-testflight-package-${{ github.run_number }}
          path: |
            Artifacts/*.json
            Artifacts/*.log
            Artifacts/TestFlight/*.ipa
          retention-days: 3
